<div class="board" >
    <p class = "title">{{this.title}}</p>
    <ul class="tool-bar">
        <button (click)="addNewColumn()">Add column</button>
        <button (click)="modifyCollabolators()">Collabolators</button>
        <button (click)="modifyLabels()">Labels</button>
        <button (click)="updateBoard()">Update board</button>
        <button (click)="deleteBoard()">Delete board</button>
        <button (click)="goToMainPage()">Go to main page</button>
    </ul>
    <ul
      cdkDropList
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="columns()"
      (cdkDropListDropped)="drop($event)"
    >
    <ul class = "columns" cdkDropListGroup>
        @for (column of columns(); track column.positionOnBoard) {
            <app-column 
                cdkDrag
                [id]="column.id"
                [cards]="column.cards"
                [position_on_board]="column.positionOnBoard"
                [title]="column.title"
                [boardId]="this.id"
                [collaborators]="this.collaborators",
                [avaibleLabels]="this.labels"
                />
        }
    </ul>
    </ul>
</div>
