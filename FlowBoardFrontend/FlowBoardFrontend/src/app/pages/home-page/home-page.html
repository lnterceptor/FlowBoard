<div class = "list-of-boards">

<div class="title-box">
        <div class = "title">Kanban board application</div>
        <button mat-icon-button aria-label="Settings" class="settings-button" (click)="toggleMenu()"><mat-icon>settings</mat-icon></button>
        
        @if (menuOpen) {
            <div class="dropdown-menu">
            <a (click)="checkProfile()">Profile</a>
            <a (click)="logout()">Logout</a>
            </div>
        }

</div>

<p class="title">User boards</p>
<ul class="grid-container">
    @for(board of boards(); track board.id){
        <app-card-of-board 
        [id]="board.id"
        [description]="board.description"
        [title]="board.title"
        />
    }
    <app-add-new-board-card
        title="create new board"
        />
</ul>
</div>


<div class = "list-of-boards">
    <p class="title">Joined boards</p>
    <ul class="grid-container">
        @for(board of joinedBoards(); track board.id){
            <app-card-of-board 
            [id]="board.id"
            [description]="board.description"
            [title]="board.title"
            />
        }
    </ul>
</div>
