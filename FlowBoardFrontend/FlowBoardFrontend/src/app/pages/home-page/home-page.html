<div class = "list-of-boards">

<button (click)="checkProfile()">Profile</button>
<button (click)="logout()">logout</button>

<p class="title">User boards</p>
<ul class="grid-container">
    @for(board of boards(); track board.id){
        <app-card-of-board 
        [id]="board.id"
        [description]="board.description"
        [title]="board.title"
        />
    }
    <app-card-of-board 
        title="add new board"
        />
</ul>
</div>


<div class = "list-of-boards">
    <p class="title">Joined boards</p>
    <ul class="grid-container">
        @for(board of joinedBoards(); track board.id){
            <app-card-of-board 
            [id]="board.id"
            [description]="board.description"
            [title]="board.title"
            />
        }
    </ul>
</div>
