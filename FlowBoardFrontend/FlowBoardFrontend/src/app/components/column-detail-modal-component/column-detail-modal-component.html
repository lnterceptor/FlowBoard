<div class="card-detail-modal">
    <form [formGroup]="columnDetailsForm" class="board-form" (ngSubmit)="sendColumnToBackend()">
        <mat-form-field class="input-title-field">    
            <mat-label>Title:</mat-label>
            <textarea matInput type=text id="title-input" formControlName="title"> </textarea>
            
        </mat-form-field>


    
    <div class="button-row">
            <button matButton="outlined" class="button-accept"  type="submit">Confirm</button>
            <div class="button-row-second-part">
                @if(this.id() != null){
                    @if(!confirmDelete){
                    <button matButton="outlined" class="delete-button" type="button" (click)="confirmDelete = true">delete</button>
                    }
                    @else {
                        <button matButton="outlined" class="button-cancel" type="button" (click)="confirmDelete = false">Cancel deletion</button>
                        <button matButton="outlined" class="delete-button" type="button" (click)="deleteColumn()">delete column</button>
                    }
                }
                <button matButton="outlined" class="button-cancel" type="button" (click)="closeModal()">cancel</button>
            </div>
    </div>

    </form>

</div>
